apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-proxy
  namespace: nginx-demo
data:
  default.conf: |
    # Default site (also serves the ALB health checks on /).
    server {
      listen 80 default_server;
      server_name _;
      location / {
        root /usr/share/nginx/html;
        index index.html;
      }
    }

    # One server block per FQDN, each proxying to that app's ClusterIP
    # Service (same cluster, any namespace). Wildcard cert *.azubisuccess.space
    # covers all names below.
    server {
      listen 80;
      server_name grafana.azubisuccess.space;

      location / {
        proxy_pass http://grafana.monitoring.svc.cluster.local:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }
