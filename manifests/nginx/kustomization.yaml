apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yml

# One file per FQDN in sites/ becomes one key (= filename) in this ConfigMap.
# Add a site: drop another <fqdn>.conf in sites/ and list it below.
configMapGenerator:
  - name: nginx-sites
    files:
      - sites/_default.conf
      - sites/grafana.azubisuccess.space.conf

# Generator output has no namespace of its own — pin it so the ConfigMap
# lands in nginx-demo where the Deployment mounts it (otherwise it defaults
# to `default` and nginx pods can't find their config).
patches:
  - target:
      kind: ConfigMap
      name: nginx-sites
    patch: |-
      - op: add
        path: /metadata/namespace
        value: nginx-demo
