# Cluster-scoped — apply MANUALLY once (see storageclass.yaml header).
# Static PV bound to the Grafana access point (POSIX 472:472, /grafana).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: grafana-efs
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: efs-sc
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-0ddb254be08c6267a::fsap-088c8c16707025698
