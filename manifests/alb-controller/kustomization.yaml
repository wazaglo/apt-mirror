apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# NOTE: intentionally NOT added to manifests/kustomization.yaml.
# The CI deploy role (bootstrap/rbac.yaml) cannot manage ClusterRoles,
# ClusterRoleBindings or webhook configs, and these objects are already
# owned by the Helm release. Apply manually if migrating off Helm:
#   kubectl apply -f manifests/alb-controller/controller.yaml
resources:
  - controller.yaml
