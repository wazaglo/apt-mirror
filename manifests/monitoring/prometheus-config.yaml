apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    scrape_configs:
      # Itself
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      # Node hardware metrics from the node-exporter DaemonSet (one per node).
      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__address__]
            regex: "(.*):10250"
            replacement: "${1}:9100"
            target_label: __address__

      # Blackbox HTTP probes of our endpoints (EDIT targets as you add sites).
      - job_name: blackbox-http
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              - https://grafana.azubisuccess.space/login
              - http://nginx.nginx-demo.svc.cluster.local
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox.monitoring.svc.cluster.local:9115
