name: pr-validate

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'envs/**'
      - 'platform/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  manifests:
    name: Kustomize build (all envs)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.29.2
      - name: Build every overlay
        run: |
          set -euo pipefail
          for d in envs/dev envs/prod; do
            kubectl kustomize "$d/" > /dev/null && echo "OK: $d"
          done
      - name: No :latest images
        run: |
          set -euo pipefail
          if grep -rEn 'image:[[:space:]]*[^ ]+:latest([[:space:]]|$)' apps/ platform/; then
            echo "::error::Pinned images required — no :latest tags (see SECURITY.md)."
            exit 1
          fi
          echo "OK: no :latest images"
# NOTE: terraform/ is intentionally NOT validated in CI. It mirrors live
# infrastructure and is run manually (`terraform plan` by an admin), so it
# stays out of the pipeline on purpose.
