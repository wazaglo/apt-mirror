name: deploy

on:
  push:
    branches:
      - main
    paths:
      - 'manifests/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Apply manifests to EKS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "${{ vars.EKS_CLUSTER_NAME }}" \
            --region "${{ vars.AWS_REGION }}"

      - name: Build manifests
        run: kubectl kustomize manifests/ > rendered.yaml

      - name: Show pending changes
        run: kubectl diff -f rendered.yaml || true

      - name: Apply manifests
        run: kubectl apply -f rendered.yaml

      - name: Wait for rollouts
        run: |
          namespaces=$(kubectl create -f rendered.yaml --dry-run=client \
            -o jsonpath='{.metadata.namespace}{"\n"}' | sed '/^$/d' | sort -u)
          for ns in $namespaces; do
            echo "Waiting on namespace: $ns"
            kubectl -n "$ns" wait \
              --for=condition=Available \
              --timeout=180s \
              deployment --all
          done

      - name: Report status
        if: always()
        run: kubectl get deployment,pod,service -A -o wide
