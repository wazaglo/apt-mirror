    storage: 300Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: efs-mirror-sc
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-0b0491ead2bac1c8c::fsap-02586212ea002c468
