apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus-efs
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: efs-sc
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-0ddb254be08c6267a::fsap-012a38be930c8a207
