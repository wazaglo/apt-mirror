# Cluster-scoped. CI deploy role CANNOT create this — apply MANUALLY once:
#   kubectl apply -f platform/external-secrets/
# Requires the eso-controller-role IRSA role (see ACTIONS.md / infra notes).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-ssm
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-west-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
