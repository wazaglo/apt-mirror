# RBAC for the 10:00 UTC sync trigger.
#
# The trigger's only job is to patch the sync-at annotation on the
# debian12-mirror-sync Deployment. That is a `patch` on one namespaced
# deployment — deliberately not a ClusterRole, and deliberately not broader
# than needed. It cannot read secrets, exec, or touch any other namespace.
#
# MANUAL, not CI — and not because of ADR-0004 cluster-scope rules, which these
# objects would otherwise satisfy (namespaced Roles are CI-manageable). They
# live here because of a bootstrap cycle:
#
#   a RoleBinding's roleRef is validated at creation, so the Role it names must
#   already exist. `kubectl diff` in deploy.yml dry-run-creates each object
#   before anything is applied, so on a cluster where neither exists yet the
#   RoleBinding dry-run is rejected with NotFound and diff exits 2. The deploy
#   job treats >1 as a hard error, so the pipeline dies BEFORE the apply step
#   and nothing lands — including the mirror itself.
#
# Keeping these three objects out of envs/dev removes that ordering
# dependency. Apply once, by hand:
#   kubectl apply -f platform/rbac-sync-trigger.yaml
#
# Re-apply after any change to the Role's rules.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: debian12-sync-trigger
  namespace: mirrors
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: debian12-sync-trigger
  namespace: mirrors
rules:
  # patch: stamp the sync-at annotation to roll the sync Deployment.
  # get: read .spec.replicas so the trigger can report that the sync is
  # deliberately scaled to zero instead of starting it.
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - debian12-mirror-sync
    verbs:
      - get
      - patch
  # No list/watch: the trigger only ever addresses one named object.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: debian12-sync-trigger
  namespace: mirrors
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: debian12-sync-trigger
subjects:
  - kind: ServiceAccount
    name: debian12-sync-trigger
    namespace: mirrors
