apiVersion: v1
kind: ServiceAccount
metadata:
  name: debian12-sync-trigger
  namespace: mirrors
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: debian12-sync-trigger
  namespace: mirrors
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - debian12-mirror-sync
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: debian12-sync-trigger
  namespace: mirrors
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: debian12-sync-trigger
subjects:
  - kind: ServiceAccount
    name: debian12-sync-trigger
    namespace: mirrors
