apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# NOTE: intentionally NOT referenced from envs/. The CI deploy role
# (platform/bootstrap-rbac.yaml) cannot manage ClusterRoles,
# ClusterRoleBindings or webhook configs, and these objects are already
# owned by the Helm release. Apply manually if migrating off Helm:
#   kubectl apply -f infra/aws-load-balancer-controller/rendered-controller.yaml
resources:
  - rendered-controller.yaml
