# Serving config for the mirror web server. The stock nginx image only serves
# /usr/share/nginx/html, but apt-mirror writes to mirror/<host>/<root>/, so the
# URLs would otherwise be /deb.debian.org/debian/dists/bookworm/Release. These
# two aliases give clients the clean paths:
#   /debian/          -> mirror/deb.debian.org/debian/
#   /debian-security/ -> mirror/security.debian.org/debian-security/
# which is what the apt sources in docs use.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mirror-nginx-conf
  namespace: mirrors
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        # The PVC is mounted at /srv/apt-mirror, which is apt-mirror's base_path.
        # apt-mirror nests its archives one level down under mirror/<host>/<root>,
        # so /debian/ maps to /srv/apt-mirror/mirror/deb.debian.org/debian/.
        # Getting this wrong is a 404, not a partial result.
        root /srv/apt-mirror/mirror;

        location /debian/ {
            alias /srv/apt-mirror/mirror/deb.debian.org/debian/;
            autoindex on;
        }

        location /debian-security/ {
            alias /srv/apt-mirror/mirror/security.debian.org/debian-security/;
            autoindex on;
        }

        # Anything else 404s. Do NOT autoindex the root: it would expose the
        # spool internals (mirror/, .temp/, dists/) to anyone who guessed the
        # hostname. Only the two archive paths are meant to be browsable.
        location / {
            return 404;
        }

        # Health endpoint for probes. Deliberately not "/" — an exact-match
        # location, so it wins over every prefix above.
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # NOTE: do not add a `location ~* \.(deb|xz|gz)$` block here to set long
        # cache headers. nginx evaluates regex locations before prefix
        # locations, so it would win over the /debian/ alias above and resolve
        # the request against `root` — every .deb would 404. If you want
        # per-extension caching later, rewrite the paths instead of aliasing
        # (drop the aliases and serve the raw mirror/<host>/<root> tree), or put
        # the caching in the front proxy where the URI is passed through
        # unchanged (see apps/nginx/base/sites/debian-mirror.azubisuccess.space.conf).
    }
