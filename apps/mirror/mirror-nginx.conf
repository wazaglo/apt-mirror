server {
    listen 80;
    server_name _;

    # The PVC is mounted at /srv/apt-mirror, which is apt-mirror's base_path.
    # apt-mirror nests its archives one level down under mirror/<host>/<root>,
    # so /debian/ maps to /srv/apt-mirror/mirror/deb.debian.org/debian/.
    # Getting this wrong is a 404, not a partial result.
    root /srv/apt-mirror/mirror;

    location /debian/ {
        alias /srv/apt-mirror/mirror/deb.debian.org/debian/;
        autoindex on;
    }

    location /debian-security/ {
        alias /srv/apt-mirror/mirror/security.debian.org/debian-security/;
        autoindex on;
    }

    location /ubuntu/ {
        alias /srv/ubuntu/mirror/archive.ubuntu.com/ubuntu/;
        autoindex on;
    }

    # Point-in-time snapshots, hardlinked by mirror-snapshot-conf. Layout is
    # snapshots/<name>/{debian,debian-security}/, so a client pins a frozen
    # package set with:
    #   deb http://debian-mirror.azubisuccess.space/snapshots/<name>/debian bookworm main
    #
    # Plain prefix + alias, no regex. A regex here would be evaluated
    # before the /debian/ alias above and could shadow it — the same class
    # of bug that 404'd every package earlier.
    location /snapshots/ {
        alias /srv/apt-mirror/snapshots/;
        autoindex on;
    }

    # Anything else 404s. Do NOT autoindex the root: it would expose the
    # spool internals (mirror/, skel/, var/) to anyone who guessed the
    # hostname. Only the archive paths and /snapshots/ are browsable.
    location / {
        return 404;
    }

    # Health endpoint for probes. Deliberately not "/" — an exact-match
    # location, so it wins over every prefix above.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # NOTE: do not add a `location ~* \.(deb|xz|gz)$` block here to set long
    # cache headers. nginx evaluates regex locations before prefix
    # locations, so it would win over the /debian/ alias above and resolve
    # the request against `root` — every .deb would 404. Put caching in the
    # edge proxy instead, where the URI is passed through unchanged.
    # See docs/mirror.md.
}
