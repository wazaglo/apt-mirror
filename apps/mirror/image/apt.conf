Acquire::Languages "none";
Acquire::GD::Base::Enable  "false";
Acquire::DEP11::Enable  "false";

# Without this apt-mirror falls back to gpgv against ~/.gnupg, which in a
# container is empty or a stale keybox, and every dist fails with
# "Can't check signature: No public key". Point it at the archive keyring that
# debian-archive-keyring installs.
signed-by=/usr/share/keyrings/debian-archive-keyring.gpg;
