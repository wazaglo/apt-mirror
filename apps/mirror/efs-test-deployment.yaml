# Was a bare Pod. CI cannot apply a bare Pod: the eks-gitops-deployer
# ClusterRole grants pods get/list/watch only, no create/patch/delete
# (platform/bootstrap-rbac.yaml). A Deployment is granted, so the same
# manifest becomes CI-deployable with no behavioural change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: efs-test
  namespace: mirrors

spec:
  replicas: 1

  selector:
    matchLabels:
      app: efs-test

  template:
    metadata:
      labels:
        app: efs-test
    spec:
      containers:
        - name: test
          # Pinned. An untagged `alpine` resolves to :latest, which this repo
          # does not deploy (SECURITY.md).
          image: alpine:3.20

          command:
            - sh
            - -c
            - |
              echo "EFS TEST $(date)" > /data/test.txt
              sleep 3600

          volumeMounts:
            - name: efs-volume
              mountPath: /data

      volumes:
        - name: efs-volume
          persistentVolumeClaim:
            claimName: debian12-mirror-pvc
