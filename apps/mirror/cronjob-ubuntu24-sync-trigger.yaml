apiVersion: batch/v1
kind: CronJob
metadata:
  name: ubuntu24-mirror-sync-trigger
  namespace: mirrors
  labels:
    app: ubuntu24-mirror-sync
spec:
  schedule: "30 12 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  suspend: true
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 120
          serviceAccountName: mirror-sync-trigger
          containers:
            - name: trigger
              image: bitnami/kubectl:1.29
              imagePullPolicy: IfNotPresent
              command:
                - /bin/bash
                - -c
              args:
                - |
                  set -euo pipefail
                  STAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  export HOME=/tmp
                  kubectl -n mirrors patch deployment ubuntu24-mirror-sync \
                    --type merge \
                    -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"mirror.azubisuccess.space/sync-at\":\"${STAMP}\"}}}}}" \
                    >/dev/null
                  echo "Triggered ubuntu24-mirror-sync at ${STAMP}"
                  REPLICAS="$(kubectl -n mirrors get deployment ubuntu24-mirror-sync -o jsonpath='{.spec.replicas}')"
                  if [ "${REPLICAS}" = "0" ]; then
                    echo "::notice::ubuntu24-mirror-sync is scaled to 0 — not starting it."
                  fi
              env:
                - name: HOME
                  value: /tmp
                - name: KUBECONFIG
                  value: /tmp/kubeconfig
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 1001
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
