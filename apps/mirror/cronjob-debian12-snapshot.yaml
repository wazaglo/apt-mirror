apiVersion: batch/v1
kind: CronJob
metadata:
  name: debian12-mirror-snapshot
  namespace: mirrors
  labels:
    app: debian12-mirror-snapshot
spec:
  schedule: "30 12 * * *"
  timeZone: Etc/UTC

  concurrencyPolicy: Forbid

  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2

  suspend: true

  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 5400
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          containers:
            - name: snapshot
              image: wazaglo/debian12-mirror@sha256:c512bae3d99d92453bb99034c4436bbd6e0c6699176fb530862cf33dea9632a1
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "/conf/snapshot.sh"]
              env:
                - name: SNAPSHOT_KEEP
                  value: "3"
                - name: SNAPSHOT_LOCK_WAIT
                  value: "300"
              resources:
                requests:
                  cpu: 200m
                  memory: 256Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: spool
                  mountPath: /var/spool/apt-mirror
                - name: conf
                  mountPath: /conf
                  readOnly: true
          volumes:
            - name: spool
              persistentVolumeClaim:
                claimName: debian12-mirror-pvc
            - name: conf
              configMap:
                name: mirror-snapshot-conf
                defaultMode: 0555
