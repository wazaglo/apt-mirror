apiVersion: apps/v1
kind: Deployment
metadata:
  name: debian12-mirror-nginx
  namespace: mirrors
  labels:
    app: debian12-mirror-nginx
spec:
  replicas: 1

  selector:
    matchLabels:
      app: debian12-mirror-nginx

  strategy:
    type: Recreate
    rollingUpdate: null

  template:
    metadata:
      labels:
        app: debian12-mirror-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30

          volumeMounts:
            - name: mirror-storage
              mountPath: /srv/apt-mirror
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run

      volumes:
        - name: mirror-storage
          persistentVolumeClaim:
            claimName: debian12-mirror-pvc
        - name: nginx-conf
          configMap:
            name: mirror-nginx-conf
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
