apiVersion: batch/v1
kind: CronJob
metadata:
  name: debian12-mirror-sync-trigger
  namespace: mirrors
  labels:
    app: debian12-mirror-sync
spec:
  schedule: "0 10 * * *"
  timeZone: Etc/UTC

  concurrencyPolicy: Forbid

  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  suspend: false

  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: debian12-sync-trigger
          containers:
            - name: trigger
              image: bitnami/kubectl:1.29
              imagePullPolicy: IfNotPresent
              command:
                - /bin/bash
                - -c
              args:
                - |
                  set -euo pipefail

                  STAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

                  export HOME=/tmp

                  kubectl -n mirrors patch deployment debian12-mirror-sync \
                    --type merge \
                    -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"mirror.azubisuccess.space/sync-at\":\"${STAMP}\"}}}}}" \
                    >/dev/null

                  echo "Triggered debian12-mirror-sync at ${STAMP}"

                  REPLICAS="$(kubectl -n mirrors get deployment debian12-mirror-sync -o jsonpath='{.spec.replicas}')"
                  if [ "${REPLICAS}" = "0" ]; then
                    echo "::notice::debian12-mirror-sync is scaled to 0 — not starting it."
                  fi

              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              env:
                - name: HOME
                  value: /tmp
                - name: KUBECONFIG
                  value: /tmp/kubeconfig
              securityContext:
                runAsNonRoot: true
                runAsUser: 1001
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
