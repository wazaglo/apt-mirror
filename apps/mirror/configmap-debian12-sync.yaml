# apt-mirror config for the Debian 12 sync. Kept in git (not baked into the
# image) so changing the dist list is a ConfigMap edit, not an image rebuild.
apiVersion: v1
kind: ConfigMap
metadata:
  name: debian12-sync-conf
  namespace: mirrors
data:
  # base_path must match the PVC mount in cronjob-debian12-sync.yaml.
  mirror.list: |
    #### Debian 12 bookworm amd64, served from EFS ####
    set base_path    /var/spool/apt-mirror
    set mirror_path  $base_path/mirror
    set skel_path    $base_path/skel
    set var_path     $base_path/var
    set cleanscript $var_path/clean.sh
    set defaultarch  amd64
    set postmirror_script $base_path/var/postmirror.sh
    set run_postmirror 1
    set nthreads     10
    set _tilde       0
    set use_proxy    0

    # bookworm-security is a SEPARATE archive rooted at /debian-security. It is
    # NOT under /debian — asking deb.debian.org/debian for a bookworm-security
    # dist is a hard 404 that aborts the entire sync. This is the exact bug the
    # previous debmirror image hit (--root=/debian with all three dists).
    deb-amd64 https://deb.debian.org/debian bookworm main contrib non-free non-free-firmware
    deb-amd64 https://deb.debian.org/debian bookworm-updates main contrib non-free non-free-firmware
    deb-amd64 https://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware

    clean https://deb.debian.org/debian
    clean https://security.debian.org/debian-security

  # Without signed-by, apt-mirror falls back to gpgv against ~/.gnupg, which is
  # empty in the container, and every dist dies with
  # "Can't check signature: No public key".
  apt.conf: |
    Acquire::Languages "none";
    Acquire::GD::Base::Enable  "false";
    Acquire::DEP11::Enable  "false";
    signed-by=/usr/share/keyrings/debian-archive-keyring.gpg;

  # apt-mirror runs this after a successful sync. Prunes translation bloat
  # only; dep11/CNF are kept because Debian apt clients expect them.
  postmirror.sh: |
    #!/bin/bash
    set -e
    find /var/spool/apt-mirror/mirror -name "Translation-*" -delete 2>/dev/null || true
