apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Prod diverges deliberately: longer Prometheus retention.
#
# The single-replica Grafana decision used to live here as a patch. It is now in
# base, because it is not a prod-specific choice — two replicas on one SQLite
# over EFS NFS is wrong in every environment, and patching it per-overlay meant
# the base kept advertising 2 replicas that KEDA would immediately undo.
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: prometheus
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: prometheus
      spec:
        template:
          spec:
            containers:
              - name: prometheus
                args:
                  - --config.file=/etc/prometheus/prometheus.yml
                  - --storage.tsdb.path=/prometheus
                  - --storage.tsdb.retention.time=24h
                  - --web.enable-lifecycle
                  - --web.enable-remote-write-receiver
