# Replaces the old in-repo Secret (deleted — values now live in SSM only).
# ESO syncs /eks-gitops/monitoring/* into the grafana-admin Secret that the
# Deployment already consumes. No deployment change needed.
#
# The SSM prefix is still /eks-gitops even though the repository is now
# apt-mirror, and that is deliberate. SSM parameter paths are independent of
# the GitHub repository name — the path is a live AWS resource holding the
# Grafana credentials, referenced here by literal key. Renaming it would mean
# re-creating the parameters and rotating the stored secret for zero functional
# gain, so it stays until someone wants to migrate the secrets on purpose.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: /eks-gitops/monitoring/grafana-admin-user
    - secretKey: admin-password
      remoteRef:
        key: /eks-gitops/monitoring/grafana-admin-password
