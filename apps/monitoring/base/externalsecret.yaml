# Replaces the old in-repo Secret (deleted — values now live in SSM only).
# ESO syncs /eks-gitops/monitoring/* into the grafana-admin Secret that the
# Deployment already consumes. No deployment change needed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: /eks-gitops/monitoring/grafana-admin-user
    - secretKey: admin-password
      remoteRef:
        key: /eks-gitops/monitoring/grafana-admin-password
