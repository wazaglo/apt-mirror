apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: nginx-demo
spec:
  # One replica, deliberately. The t3.small nodegroup allows 11 pods per node
  # and the day-time cluster sits at that ceiling, so a second front-proxy
  # replica does not fail over gracefully — it simply cannot schedule, and it
  # starves whatever pod is next in line (this already left a sync-trigger Job
  # Pending for hours). One replica keeps a pod slot free for real work; raise
  # the nodegroup size first, then this number.
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx@sha256:abe47724e466aeab9a345d8e46a221c2fa8953c7848bb4a3bd9976a7199f8cf2
          ports:
            - containerPort: 80
          volumeMounts:
            - name: proxy-config
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: proxy-config
          configMap:
            name: nginx-sites
