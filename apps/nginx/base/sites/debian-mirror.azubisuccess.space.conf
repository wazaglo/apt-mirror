# debian-mirror.azubisuccess.space → the Debian 12 mirror in the mirrors
# namespace. Lands in the nginx-sites ConfigMap that the front-proxy Deployment
# mounts at /etc/nginx/conf.d (see apps/nginx/base/kustomization.yaml).
#
# Single-argument proxy_pass everywhere: it forwards the original request URI
# unchanged. The two-argument form would rewrite the path and break apt, which
# asks for exact paths like /debian/dists/bookworm/Release.
#
# The wildcard cert *.azubisuccess.space already covers this name (ACM
# certificate cbf8d3ed-0f1f-4eeb-bba1-7093cdaf4fc6), so no new certificate is
# needed. TLS terminates at the ALB; nginx sees plain HTTP on :80.

# Load balancing is delegated to the Kubernetes Service: it resolves to the
# ClusterIP, and kube-proxy spreads connections across the ready endpoints of
# the debian12-mirror-nginx pods. least_conn then matters only once there is
# more than one endpoint — the serving tier is replicas: 1 today because the
# t3.small nodegroup is at its pod ceiling, so raise both together.
upstream debian12_mirror {
    least_conn;

    # The Service name, not the ClusterIP literal: re-created Services get a
    # different ClusterIP and a hardcoded IP would go stale until an nginx
    # reload. Note nginx resolves upstream DNS at startup only.
    server debian12-mirror-service.mirrors.svc.cluster.local:80
        max_fails=3
        fail_timeout=10s;

    # Long-lived upstream connections. Without this every one of the hundreds
    # of Packages/*.deb fetches in a single apt-get opens a fresh TCP
    # connection through the proxy.
    keepalive 32;
}

server {
    listen 80;
    server_name debian-mirror.azubisuccess.space;

    # A mirror that is down must not look like an empty but healthy mirror, so
    # fail fast rather than hanging an apt-get.
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    proxy_http_version 1.1;
    # Empty Connection header is what actually enables upstream keepalive.
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # .deb files are large and immutable. Buffering them through the proxy
    # wastes memory on t3.small nodes and stalls the transfer, so stream them.
    # Safe to do in a regex location here (unlike inside the mirror itself):
    # the URI is passed through unchanged either way, so the path mapping is
    # unaffected by location precedence.
    location ~* \.deb$ {
        proxy_pass http://debian12_mirror;

        proxy_buffering off;
        proxy_max_temp_file_size 0;

        # Release/Packages are re-fetched constantly and must never be cached
        # stale, so only .deb gets a long TTL.
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # Everything else — dists/, pool indexes, the browsable root.
    location / {
        proxy_pass http://debian12_mirror;
    }
}
