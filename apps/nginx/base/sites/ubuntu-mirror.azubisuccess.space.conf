upstream ubuntu24_mirror {
    least_conn;

    server debian12-mirror-service.mirrors.svc.cluster.local:80
        max_fails=3
        fail_timeout=10s;

    keepalive 32;
}

server {
    listen 80;
    server_name ubuntu-mirror.azubisuccess.space;

    # Deliberately the same serving tier as Debian. Both distros are served by
    # one mirror-nginx behind one Service; this hostname only selects the
    # path prefix. Scaling the serving tier is a capacity decision, not a
    # per-distro one.

    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # .deb files are large and immutable, so stream rather than buffer them.
    # Safe as a regex location here (unlike in the mirror itself) because the
    # URI reaches the upstream unchanged either way.
    location ~* \.deb$ {
        proxy_pass http://ubuntu24_mirror;

        proxy_buffering off;
        proxy_max_temp_file_size 0;

        # Release/Packages are refetched constantly and must never be cached
        # stale, so only .deb gets a long TTL.
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location / {
        proxy_pass http://ubuntu24_mirror;
    }
}
