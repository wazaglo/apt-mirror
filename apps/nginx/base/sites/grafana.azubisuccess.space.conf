# grafana.azubisuccess.space → Grafana in monitoring.
# Wildcard cert *.azubisuccess.space terminates at the ALB; nginx sees HTTP.
server {
  listen 80;
  server_name grafana.azubisuccess.space;

  location / {
    proxy_pass http://grafana.monitoring.svc.cluster.local:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
