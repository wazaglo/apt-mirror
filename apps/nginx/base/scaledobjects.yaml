apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: nginx-schedule
  namespace: nginx-demo
spec:
  scaleTargetRef:
    name: nginx
  minReplicaCount: 0
  maxReplicaCount: 2
  pollingInterval: 60
  cooldownPeriod: 30
  triggers:
    - type: cron
      metadata:
        timezone: Etc/UTC
        start: "5 10 * * *"
        end: "54 17 * * *"
        desiredReplicas: "2"
